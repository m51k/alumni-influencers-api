<!DOCTYPE html>
<html>
<head>
    <title>Alumni Influencer of the Day</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen">
<div id="navbar"></div>
<script src="navbar.js"></script>

<div class="max-w-2xl mx-auto p-6">
    <h2 class="text-2xl font-bold mb-6 text-gray-800">Alumni Influencer of the Day</h2>

    <div class="bg-white rounded shadow p-4 mb-6 flex gap-3 items-center">
        <input type="text" id="api-key" placeholder="Enter API key"
               class="flex-1 border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm">
        <button onclick="load()"
                class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700 transition text-sm">Load
        </button>
    </div>

    <div id="result"></div>
</div>

<script>
    async function load() {
        const key = document.getElementById('api-key').value;
        const res = await fetch('/index.php/api/v1/alumni/today', {
            headers: {'Authorization': 'Bearer ' + key}
        });
        const data = await res.json();

        if (!data.status) {
            document.getElementById('result').innerHTML =
                '<div class="bg-white rounded shadow p-4 text-red-500">' + data.message + '</div>';
            return;
        }

        document.getElementById('result').innerHTML = `
            <div class="bg-white rounded shadow p-6 space-y-4">
                <h3 class="text-xl font-bold text-gray-800">Featured Alumnus</h3>
                <div class="text-sm text-gray-500">
                    <p>Slot date: ${data.slot_date}</p>
                    <p>Appearances today: ${data.appearance_count}</p>
                </div>
                ${data.profile.image_path ? '<img src="/' + data.profile.image_path + '" class="w-24 h-24 rounded-full object-cover">' : ''}
                ${data.profile.linkedin_url ? '<a href="' + data.profile.linkedin_url + '" target="_blank" class="text-blue-600 hover:underline text-sm">LinkedIn Profile</a>' : ''}
                <div>
                    <h4 class="font-semibold text-gray-700 mb-1">Degrees</h4>
                    <ul class="list-disc list-inside text-sm text-gray-600 space-y-1">
                        ${data.degrees.map(d => '<li>' + d.qualification + ' - ' + d.institution + '</li>').join('')}
                    </ul>
                </div>
                <div>
                    <h4 class="font-semibold text-gray-700 mb-1">Employment</h4>
                    <ul class="list-disc list-inside text-sm text-gray-600 space-y-1">
                        ${data.employment.map(e => '<li>' + e.role + ' at ' + e.company + '</li>').join('')}
                    </ul>
                </div>
                <div>
                    <h4 class="font-semibold text-gray-700 mb-1">Certifications</h4>
                    <ul class="list-disc list-inside text-sm text-gray-600 space-y-1">
                        ${data.certifications.map(c => '<li>' + c.title + ' - ' + c.issuer + '</li>').join('')}
                    </ul>
                </div>
                <div>
                    <h4 class="font-semibold text-gray-700 mb-1">Courses</h4>
                    <ul class="list-disc list-inside text-sm text-gray-600 space-y-1">
                        ${data.courses.map(c => '<li>' + c.title + ' - ' + c.provider + '</li>').join('')}
                    </ul>
                </div>
            </div>`;
    }
</script>
</body>
</html>
