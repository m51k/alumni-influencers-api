      description: Returns time-series data that can be used to plot trend graphs.
      tags: [ Analytics ]
      parameters:
        - in: query
          name: metric
          required: true
          schema:
            type: string
            enum: [ registrations, employment, bids, certifications ]
          description: The metric to trend
        - in: query
          name: from
          schema:
            type: string
            format: date
          description: Start date (inclusive)
        - in: query
          name: to
          schema:
            type: string
            format: date
          description: End date (inclusive)
        - in: query
          name: granularity
          schema:
            type: string
            enum: [ day, week, month ]
            default: month
