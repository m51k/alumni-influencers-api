openapi: 3.0.0
info:
  title: Alumni Influencers API
  description: API for the University of Eastminster Alumni Influencers Platform
  version: 1.0.0
servers:
  - url: http://localhost:8080/index.php/api/v1
    description: Local development server
components:
  securitySchemes:
    ApiKeyAuth:
      type: http
      scheme: bearer
      description: API key for public endpoints (developer-issued)
  schemas:
    Error:
      type: object
      properties:
        status:
          type: boolean
          example: false
        message:
          type: string
          example: Something went wrong
    Success:
      type: object
      properties:
        status:
          type: boolean
          example: true
        message:
          type: string
          example: Operation completed successfully
    Degree:
      type: object
      properties:
        id:
          type: integer
        institution:
          type: string
        qualification:
          type: string
        grad_year:
          type: integer
    Certification:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        issuer:
          type: string
        issued_at:
          type: string
          format: date
    Licence:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        issuer:
          type: string
        expires_at:
          type: string
          format: date
    Course:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        provider:
          type: string
        completed_at:
          type: string
          format: date
    Employment:
      type: object
      properties:
        id:
          type: integer
        company:
          type: string
        role:
          type: string
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
          nullable: true
    AlumnusProfile:
      type: object
      properties:
        id:
          type: integer
        email:
          type: string
        first_name:
          type: string
        last_name:
          type: string
        linkedin_url:
          type: string
          nullable: true
        profile_image:
          type: string
          nullable: true
        degrees:
          type: array
          items:
            $ref: '#/components/schemas/Degree'
        certifications:
          type: array
          items:
            $ref: '#/components/schemas/Certification'
        licences:
          type: array
          items:
            $ref: '#/components/schemas/Licence'
        courses:
          type: array
          items:
            $ref: '#/components/schemas/Course'
        employment:
          type: array
          items:
            $ref: '#/components/schemas/Employment'
    Bid:
      type: object
      properties:
        id:
          type: integer
        slot_date:
          type: string
          format: date
        amount:
          type: number
          format: float
        status:
          type: string
          enum: [ pending, winning, outbid, won, lost, cancelled ]
        placed_at:
          type: string
          format: date-time
    ApiKey:
      type: object
      properties:
        id:
          type: integer
        label:
          type: string
        key:
          type: string
          description: Only returned on creation
        created_at:
          type: string
          format: date-time
        revoked:
          type: boolean
    Event:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        description:
          type: string
          nullable: true
        date:
          type: string
          format: date-time
        location:
          type: string
          nullable: true
        url:
          type: string
          nullable: true
  parameters:
    AnalyticsFilters:
      in: query
      name: cohort_year
      schema:
        type: integer
      description: Filter by graduation cohort year
security:
  - BearerAuth: [ ]
paths:
  /auth/ping:
    get:
      summary: Health check
      description: Returns a simple pong response to confirm the API is reachable. No authentication required.
      tags: [ Auth ]
      security: [ ]
      responses:
        '200':
          description: API is reachable
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: pong
  /auth/register:
    post:
      summary: Register a new user
      tags: [ Auth ]
      security: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ email, password, role ]
              properties:
                email:
                  type: string
                  format: email
                  example: user@gmail.com
                password:
                  type: string
                  format: password
                  example: password123
                role:
                  type: string
                  enum: [ alumnus, developer ]
                first_name:
                  type: string
                  example: Jane
                last_name:
                  type: string
                  example: Doe
      responses:
        '201':
          description: Registered successfully – verification email sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Email already registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /auth/verify/{token}:
    get:
      summary: Verify email address
      tags: [ Auth ]
      security: [ ]
      parameters:
        - in: path
          name: token
          required: true
          schema:
            type: string
          description: Email verification token sent to the user's inbox
      responses:
        '200':
          description: Email verified successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
        '400':
          description: Invalid or expired token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /auth/login:
    post:
      summary: Login
      tags: [ Auth ]
      security: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ email, password ]
              properties:
                email:
                  type: string
                  format: email
                  example: user@gmail.com
                password:
                  type: string
                  format: password
                  example: password123
      responses:
        '200':
          description: Logged in successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: boolean
                    example: true
                  token:
                    type: string
                    description: Bearer token to use in subsequent requests
                  role:
                    type: string
                    enum: [ alumnus, developer ]
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Email not verified
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /auth/logout:
    post:
      summary: Logout (invalidate session token)
      tags: [ Auth ]
      responses:
        '200':
          description: Logged out successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /auth/forgot-password:
    post:
      summary: Request password reset
      description: Sends a reset link to the provided email if an account exists.
      tags: [ Auth ]
      security: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ email ]
              properties:
                email:
                  type: string
                  format: email
                  example: user@gmail.com
      responses:
        '200':
          description: Reset link sent (response is the same whether the email exists or not)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
  /auth/reset-password:
    post:
      summary: Reset password using token
      tags: [ Auth ]
      security: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ token, password ]
              properties:
                token:
                  type: string
                password:
                  type: string
                  format: password
                  example: newPassword456
      responses:
        '200':
          description: Password reset successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
        '400':
          description: Invalid or expired token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /auth/role:
    get:
      summary: Get the authenticated user's role
      tags: [ Auth ]
      responses:
        '200':
          description: Role returned
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: boolean
                    example: true
                  role:
                    type: string
                    enum: [ alumnus, developer ]
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /alumnus/profile:
    get:
      summary: Get full alumnus profile
      tags: [ Profile ]
      responses:
        '200':
          description: Profile returned
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/AlumnusProfile'
        '401':
          description: Unauthenticated
        '404':
          description: Profile not found
    put:
      summary: Update alumnus profile
      tags: [ Profile ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                first_name:
                  type: string
                last_name:
                  type: string
                linkedin_url:
                  type: string
                  format: uri
                  example: https://linkedin.com/in/janedoe
      responses:
        '200':
          description: Profile updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
        '400':
          description: Validation error
        '401':
          description: Unauthenticated
    delete:
      summary: Delete alumnus profile (account)
      tags: [ Profile ]
      responses:
        '200':
          description: Profile deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
        '401':
          description: Unauthenticated
  /alumnus/profile/image:
    post:
      summary: Upload profile image
      tags: [ Profile ]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [ image ]
              properties:
                image:
                  type: string
                  format: binary
                  description: JPEG or PNG, max 2 MB
      responses:
        '200':
          description: Image uploaded
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: boolean
                    example: true
                  url:
                    type: string
                    example: https://cdn.example.com/profiles/abc123.jpg
        '400':
          description: Invalid file type or size
        '401':
          description: Unauthenticated
  /alumnus/degrees:
    get:
      summary: Get degrees
      tags: [ Profile ]
      responses:
        '200':
          description: Degrees returned
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Degree'
        '401':
          description: Unauthenticated
    post:
      summary: Add degree
      tags: [ Profile ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ institution, qualification ]
              properties:
                institution:
                  type: string
                  example: University of Eastminster
                qualification:
                  type: string
                  example: BSc Computer Science
                grad_year:
                  type: integer
                  example: 2022
      responses:
        '201':
          description: Degree added
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/Degree'
        '400':
          description: Validation error
        '401':
          description: Unauthenticated
  /alumnus/degrees/{id}:
    put:
      summary: Update degree
      tags: [ Profile ]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                institution:
                  type: string
                qualification:
                  type: string
                grad_year:
                  type: integer
      responses:
        '200':
          description: Degree updated
        '400':
          description: Validation error
        '401':
          description: Unauthenticated
        '404':
          description: Degree not found
    delete:
      summary: Delete degree
      tags: [ Profile ]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Degree deleted
        '401':
          description: Unauthenticated
        '404':
          description: Degree not found
  /alumnus/certifications:
    get:
      summary: Get certifications
      tags: [ Profile ]
      responses:
        '200':
          description: Certifications returned
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Certification'
        '401':
          description: Unauthenticated
    post:
      summary: Add certification
      tags: [ Profile ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ title, issuer ]
              properties:
                title:
                  type: string
                  example: AWS Certified Solutions Architect
                issuer:
                  type: string
                  example: Amazon Web Services
                issued_at:
                  type: string
                  format: date
                  example: '2023-06-01'
      responses:
        '201':
          description: Certification added
        '400':
          description: Validation error
        '401':
          description: Unauthenticated
  /alumnus/certifications/{id}:
    put:
      summary: Update certification
      tags: [ Profile ]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                issuer:
                  type: string
                issued_at:
                  type: string
                  format: date
      responses:
        '200':
          description: Certification updated
        '401':
          description: Unauthenticated
        '404':
          description: Certification not found
    delete:
      summary: Delete certification
      tags: [ Profile ]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Certification deleted
        '401':
          description: Unauthenticated
        '404':
          description: Certification not found
  /alumnus/licences:
    get:
      summary: Get licences
      tags: [ Profile ]
      responses:
        '200':
          description: Licences returned
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Licence'
        '401':
          description: Unauthenticated
    post:
      summary: Add licence
      tags: [ Profile ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ title, issuer ]
              properties:
                title:
                  type: string
                  example: Full Stack Driver Licence
                issuer:
                  type: string
                  example: DVLA
                expires_at:
                  type: string
                  format: date
                  example: '2028-01-01'
      responses:
        '201':
          description: Licence added
        '400':
          description: Validation error
        '401':
          description: Unauthenticated
  /alumnus/licences/{id}:
    put:
      summary: Update licence
      tags: [ Profile ]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                issuer:
                  type: string
                expires_at:
                  type: string
                  format: date
      responses:
        '200':
          description: Licence updated
        '401':
          description: Unauthenticated
        '404':
          description: Licence not found
    delete:
      summary: Delete licence
      tags: [ Profile ]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Licence deleted
        '401':
          description: Unauthenticated
        '404':
          description: Licence not found
  /alumnus/courses:
    get:
      summary: Get courses
      tags: [ Profile ]
      responses:
        '200':
          description: Courses returned
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Course'
        '401':
          description: Unauthenticated
    post:
      summary: Add course
      tags: [ Profile ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ title, provider ]
              properties:
                title:
                  type: string
                  example: Machine Learning Specialisation
                provider:
                  type: string
                  example: Coursera
                completed_at:
                  type: string
                  format: date
                  example: '2024-03-15'
      responses:
        '201':
          description: Course added
        '400':
          description: Validation error
        '401':
          description: Unauthenticated
  /alumnus/courses/{id}:
    put:
      summary: Update course
      tags: [ Profile ]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                provider:
                  type: string
                completed_at:
                  type: string
                  format: date
      responses:
        '200':
          description: Course updated
        '401':
          description: Unauthenticated
        '404':
          description: Course not found
    delete:
      summary: Delete course
      tags: [ Profile ]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Course deleted
        '401':
          description: Unauthenticated
        '404':
          description: Course not found
  /alumnus/employment:
    get:
      summary: Get employment history
      tags: [ Profile ]
      responses:
        '200':
          description: Employment returned
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Employment'
        '401':
          description: Unauthenticated
    post:
      summary: Add employment record
      tags: [ Profile ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ company, role, start_date ]
              properties:
                company:
                  type: string
                  example: Acme Corp
                role:
                  type: string
                  example: Software Engineer
                start_date:
                  type: string
                  format: date
                  example: '2022-09-01'
                end_date:
                  type: string
                  format: date
                  nullable: true
                  example: '2024-01-31'
      responses:
        '201':
          description: Employment added
        '400':
          description: Validation error
        '401':
          description: Unauthenticated
  /alumnus/employment/{id}:
    put:
      summary: Update employment record
      tags: [ Profile ]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                company:
                  type: string
                role:
                  type: string
                start_date:
                  type: string
                  format: date
                end_date:
                  type: string
                  format: date
                  nullable: true
      responses:
        '200':
          description: Employment updated
        '401':
          description: Unauthenticated
        '404':
          description: Employment record not found
    delete:
      summary: Delete employment record
      tags: [ Profile ]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Employment deleted
        '401':
          description: Unauthenticated
        '404':
          description: Employment record not found
  /alumnus/bid/slot:
    get:
      summary: View tomorrow's featured slot details
      description: Returns information about the upcoming slot that alumni can bid on.
      tags: [ Bidding ]
      responses:
        '200':
          description: Slot info returned
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      slot_date:
                        type: string
                        format: date
                        example: '2026-05-02'
                      current_highest_bid:
                        type: number
                        format: float
                        example: 45.00
                      total_bids:
                        type: integer
                        example: 7
        '401':
          description: Unauthenticated
  /alumnus/bid:
    post:
      summary: Place a bid on tomorrow's slot
      tags: [ Bidding ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ amount ]
              properties:
                amount:
                  type: number
                  format: float
                  example: 50.00
      responses:
        '201':
          description: Bid placed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/Bid'
        '400':
          description: Validation error (e.g. amount too low)
        '401':
          description: Unauthenticated
        '403':
          description: Monthly bid limit reached
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Already have an active bid on this slot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /alumnus/bid/{id}:
    put:
      summary: Increase an existing bid (amount must be higher than current bid)
      tags: [ Bidding ]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ amount ]
              properties:
                amount:
                  type: number
                  format: float
                  example: 75.00
      responses:
        '200':
          description: Bid updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/Bid'
        '400':
          description: Amount must be higher than current bid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthenticated
        '404':
          description: Bid not found
    delete:
      summary: Cancel a bid
      tags: [ Bidding ]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Bid cancelled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
        '401':
          description: Unauthenticated
        '404':
          description: Bid not found
  /alumnus/bid/status:
    get:
      summary: View own current bid status for the upcoming slot
      tags: [ Bidding ]
      responses:
        '200':
          description: Bid status returned
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/Bid'
        '401':
          description: Unauthenticated
        '404':
          description: No active bid found for this alumnus
  /alumnus/bid/history:
    get:
      summary: View bid history (all past bids)
      tags: [ Bidding ]
      parameters:
        - in: query
          name: page
          schema:
            type: integer
