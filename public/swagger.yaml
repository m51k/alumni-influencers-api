  /developer/keys:
    get:
      summary: List all API keys for the authenticated developer
      tags: [ Developer ]
      responses:
        '200':
          description: Keys returned
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ApiKey'
        '401':
          description: Unauthenticated
    post:
      summary: Generate a new API key
      tags: [ Developer ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ label ]
              properties:
                label:
                  type: string
                  example: My Mobile App
      responses:
        '201':
          description: API key generated – the raw key is only returned once
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/ApiKey'
        '400':
          description: Validation error
        '401':
          description: Unauthenticated
  /developer/keys/{id}:
    delete:
      summary: Revoke an API key
      tags: [ Developer ]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Key revoked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
        '401':
          description: Unauthenticated
        '404':
          description: Key not found
        '409':
          description: Key already revoked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /developer/keys/{id}/stats:
    get:
      summary: View usage statistics for an API key
      tags: [ Developer ]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Stats returned
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      key_id:
                        type: integer
                      label:
                        type: string
                      total_requests:
                        type: integer
                        example: 1240
                      requests_today:
                        type: integer
                        example: 38
                      last_used_at:
                        type: string
                        format: date-time
        '401':
          description: Unauthenticated
        '404':
          description: Key not found
