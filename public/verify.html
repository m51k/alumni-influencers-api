<!DOCTYPE html>
<html>
<head>
    <title>Verify Email</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center">
<div class="bg-white p-8 rounded shadow w-full max-w-md text-center">
    <h2 class="text-2xl font-bold mb-4 text-gray-800">Email Verification</h2>
    <p id="msg" class="text-gray-600 mb-6">Verifying...</p>
    <a href="login.html" class="text-blue-600 hover:underline text-sm">Go to login</a>
</div>
<script>
    const token = new URLSearchParams(window.location.search).get('token');
    if (!token) {
        document.getElementById('msg').textContent = 'No token provided.';
    } else {
        fetch('/index.php/api/v1/auth/verify/' + token)
            .then(r => r.json())
            .then(data => {
                const msg = document.getElementById('msg');
                msg.textContent = data.message;
                msg.className = data.status ? 'text-green-600 mb-6' : 'text-red-500 mb-6';
            });
    }
</script>
</body>
</html>
