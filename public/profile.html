<!DOCTYPE html>
<html>
<head>
    <title>My Profile</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen">
<div id="navbar"></div>
<script src="navbar.js"></script>

<div class="max-w-3xl mx-auto p-6 space-y-6">
    <h2 class="text-2xl font-bold text-gray-800">My Profile</h2>

    <!-- Profile summary -->
    <div id="profile" class="bg-white rounded shadow p-4 text-sm text-gray-700 space-y-1"></div>

    <!-- Update profile details -->
    <div class="bg-white rounded shadow p-4 space-y-3">
        <h3 class="font-semibold text-gray-700">Update Profile Details</h3>
        <input type="text" id="linkedin" placeholder="LinkedIn URL"
               class="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
        <input type="text" id="programme" placeholder="Programme e.g. BSc Computer Science"
               class="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
        <input type="text" id="location" placeholder="Location e.g. London"
               class="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
        <button onclick="updateProfile()"
                class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700 transition text-sm">Update
        </button>
    </div>

    <!-- Upload image -->
    <div class="bg-white rounded shadow p-4 space-y-3">
        <h3 class="font-semibold text-gray-700">Upload Profile Image</h3>
        <input type="file" id="image" class="text-sm text-gray-600">
        <button onclick="uploadImage()"
                class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700 transition text-sm">Upload
        </button>
    </div>

    <!-- Degrees -->
    <div class="bg-white rounded shadow p-4 space-y-3">
        <h3 class="font-semibold text-gray-700">Degrees</h3>
        <div id="degrees" class="text-sm text-gray-600"></div>
        <div class="flex flex-wrap gap-2">
            <input type="text" id="deg-institution" placeholder="Institution"
                   class="border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
            <input type="text" id="deg-qualification" placeholder="Qualification"
                   class="border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
            <input type="number" id="deg-year" placeholder="Grad year"
                   class="border border-gray-300 rounded px-3 py-2 text-sm w-28 focus:outline-none focus:ring-2 focus:ring-blue-500">
            <button onclick="addDegree()"
                    class="bg-green-600 text-white px-4 py-2 rounded hover:bg-green-700 transition text-sm">Add
            </button>
        </div>
    </div>

    <!-- Certifications -->
    <div class="bg-white rounded shadow p-4 space-y-3">
        <h3 class="font-semibold text-gray-700">Certifications</h3>
        <div id="certifications" class="text-sm text-gray-600"></div>
        <div class="flex flex-wrap gap-2">
            <input type="text" id="cert-title" placeholder="Title"
                   class="border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
            <input type="text" id="cert-issuer" placeholder="Issuer"
                   class="border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
            <input type="date" id="cert-issued"
                   class="border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
            <button onclick="addCertification()"
                    class="bg-green-600 text-white px-4 py-2 rounded hover:bg-green-700 transition text-sm">Add
            </button>
        </div>
    </div>

    <!-- Licences -->
    <div class="bg-white rounded shadow p-4 space-y-3">
        <h3 class="font-semibold text-gray-700">Licences</h3>
        <div id="licences" class="text-sm text-gray-600"></div>
        <div class="flex flex-wrap gap-2">
            <input type="text" id="lic-title" placeholder="Title"
                   class="border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
            <input type="text" id="lic-issuer" placeholder="Issuer"
                   class="border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
            <input type="date" id="lic-expires"
                   class="border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
            <button onclick="addLicence()"
                    class="bg-green-600 text-white px-4 py-2 rounded hover:bg-green-700 transition text-sm">Add
            </button>
        </div>
    </div>

    <!-- Courses -->
    <div class="bg-white rounded shadow p-4 space-y-3">
        <h3 class="font-semibold text-gray-700">Courses</h3>
        <div id="courses" class="text-sm text-gray-600"></div>
        <div class="flex flex-wrap gap-2">
            <input type="text" id="course-title" placeholder="Title"
                   class="border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
            <input type="text" id="course-provider" placeholder="Provider"
                   class="border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
            <input type="date" id="course-completed"
                   class="border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
            <button onclick="addCourse()"
                    class="bg-green-600 text-white px-4 py-2 rounded hover:bg-green-700 transition text-sm">Add
            </button>
        </div>
    </div>

    <!-- Employment -->
    <div class="bg-white rounded shadow p-4 space-y-3">
        <h3 class="font-semibold text-gray-700">Employment</h3>
        <div id="employment" class="text-sm text-gray-600"></div>
        <div class="flex flex-wrap gap-2">
            <input type="text" id="emp-company" placeholder="Company"
                   class="border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
            <input type="text" id="emp-role" placeholder="Role"
                   class="border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
            <input type="date" id="emp-start"
                   class="border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
            <input type="date" id="emp-end"
                   class="border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
            <button onclick="addEmployment()"
                    class="bg-green-600 text-white px-4 py-2 rounded hover:bg-green-700 transition text-sm">Add
            </button>
        </div>
    </div>

    <p id="msg" class="text-sm text-green-600"></p>
    <a href="bid.html" class="text-blue-600 hover:underline text-sm">Go to Bidding</a>
</div>

<script>
    const BASE = '/index.php/api/v1';

    async function loadProfile() {
        const res = await fetch(BASE + '/alumnus/profile', {credentials: 'same-origin'});
        if (res.status === 401) {
            window.location.href = 'login.html';
            return;
        }
        const data = await res.json();

        document.getElementById('profile').innerHTML =
            '<p>LinkedIn: ' + (data.profile.linkedin_url || 'Not set') + '</p>' +
            '<p>Programme: ' + (data.profile.programme || 'Not set') + '</p>' +
            '<p>Location: ' + (data.profile.location || 'Not set') + '</p>' +
            '<p>Complete: ' + (data.profile.is_complete ? '<span class="text-green-600">Yes</span>' : '<span class="text-red-400">No</span>') + '</p>' +
            (data.profile.image_path ? '<img src="/' + data.profile.image_path + '" class="w-20 h-20 rounded-full object-cover mt-2">' : '');

        document.getElementById('degrees').innerHTML = '<ul class="list-disc list-inside space-y-1">' +
            data.degrees.map(d =>
                '<li>' + d.qualification + ' - ' + d.institution + ' (' + (d.grad_year || 'N/A') + ')' +
                ' <button onclick="deleteDegree(' + d.id + ')" class="text-red-400 hover:text-red-600 text-xs ml-2">Delete</button></li>'
            ).join('') + '</ul>';

        document.getElementById('certifications').innerHTML = '<ul class="list-disc list-inside space-y-1">' +
            data.certifications.map(c =>
                '<li>' + c.title + ' - ' + c.issuer +
                ' <button onclick="deleteCertification(' + c.id + ')" class="text-red-400 hover:text-red-600 text-xs ml-2">Delete</button></li>'
            ).join('') + '</ul>';

        document.getElementById('licences').innerHTML = '<ul class="list-disc list-inside space-y-1">' +
            data.licences.map(l =>
                '<li>' + l.title + ' - ' + l.issuer +
                ' <button onclick="deleteLicence(' + l.id + ')" class="text-red-400 hover:text-red-600 text-xs ml-2">Delete</button></li>'
            ).join('') + '</ul>';

        document.getElementById('courses').innerHTML = '<ul class="list-disc list-inside space-y-1">' +
            data.courses.map(c =>
                '<li>' + c.title + ' - ' + c.provider +
                ' <button onclick="deleteCourse(' + c.id + ')" class="text-red-400 hover:text-red-600 text-xs ml-2">Delete</button></li>'
            ).join('') + '</ul>';

        document.getElementById('employment').innerHTML = '<ul class="list-disc list-inside space-y-1">' +
            data.employment.map(e =>
                '<li>' + e.role + ' at ' + e.company + ' (' + e.start_date + ' - ' + (e.end_date || 'Present') + ')' +
                ' <button onclick="deleteEmployment(' + e.id + ')" class="text-red-400 hover:text-red-600 text-xs ml-2">Delete</button></li>'
            ).join('') + '</ul>';
    }

    async function updateProfile() {
        const res = await fetch(BASE + '/alumnus/profile', {
            method: 'PUT',
            headers: {'Content-Type': 'application/json'},
            credentials: 'same-origin',
            body: JSON.stringify({
                linkedin_url: document.getElementById('linkedin').value,
                programme: document.getElementById('programme').value,
                location: document.getElementById('location').value
            })
        });
        const data = await res.json();
        document.getElementById('msg').textContent = data.message;
        loadProfile();
    }

    async function uploadImage() {
        const formData = new FormData();
        formData.append('image', document.getElementById('image').files[0]);
        const res = await fetch(BASE + '/alumnus/profile/image', {
            method: 'POST',
            credentials: 'same-origin',
            body: formData
        });
        const data = await res.json();
        document.getElementById('msg').textContent = data.message;
        loadProfile();
    }

    async function addDegree() {
        const res = await fetch(BASE + '/alumnus/degrees', {
            method: 'POST', headers: {'Content-Type': 'application/json'}, credentials: 'same-origin',
            body: JSON.stringify({
                institution: document.getElementById('deg-institution').value,
                qualification: document.getElementById('deg-qualification').value,
                grad_year: document.getElementById('deg-year').value
            })
        });
        const data = await res.json();
        document.getElementById('msg').textContent = data.message;
        loadProfile();
    }

    async function deleteDegree(id) {
        await fetch(BASE + '/alumnus/degrees/' + id, {method: 'DELETE', credentials: 'same-origin'});
        loadProfile();
    }

    async function addCertification() {
        const res = await fetch(BASE + '/alumnus/certifications', {
            method: 'POST', headers: {'Content-Type': 'application/json'}, credentials: 'same-origin',
            body: JSON.stringify({
                title: document.getElementById('cert-title').value,
                issuer: document.getElementById('cert-issuer').value,
                issued_at: document.getElementById('cert-issued').value
            })
        });
        const data = await res.json();
        document.getElementById('msg').textContent = data.message;
        loadProfile();
    }

    async function deleteCertification(id) {
        await fetch(BASE + '/alumnus/certifications/' + id, {method: 'DELETE', credentials: 'same-origin'});
        loadProfile();
    }

    async function addLicence() {
        const res = await fetch(BASE + '/alumnus/certifications', {
            method: 'POST', headers: {'Content-Type': 'application/json'}, credentials: 'same-origin',
            body: JSON.stringify({
                title: document.getElementById('lic-title').value,
                issuer: document.getElementById('lic-issuer').value,
                expires_at: document.getElementById('lic-expires').value
            })
        });
        const data = await res.json();
        document.getElementById('msg').textContent = data.message;
        loadProfile();
    }

    async function deleteLicence(id) {
        await fetch(BASE + '/alumnus/licences/' + id, {method: 'DELETE', credentials: 'same-origin'});
        loadProfile();
    }

    async function addCourse() {
        const res = await fetch(BASE + '/alumnus/courses', {
            method: 'POST', headers: {'Content-Type': 'application/json'}, credentials: 'same-origin',
            body: JSON.stringify({
                title: document.getElementById('course-title').value,
                provider: document.getElementById('course-provider').value,
                completed_at: document.getElementById('course-completed').value
            })
        });
        const data = await res.json();
        document.getElementById('msg').textContent = data.message;
        loadProfile();
    }

    async function deleteCourse(id) {
        await fetch(BASE + '/alumnus/courses/' + id, {method: 'DELETE', credentials: 'same-origin'});
        loadProfile();
    }

    async function addEmployment() {
        const res = await fetch(BASE + '/alumnus/employment', {
            method: 'POST', headers: {'Content-Type': 'application/json'}, credentials: 'same-origin',
            body: JSON.stringify({
                company: document.getElementById('emp-company').value,
                role: document.getElementById('emp-role').value,
                start_date: document.getElementById('emp-start').value,
                end_date: document.getElementById('emp-end').value
            })
        });
        const data = await res.json();
        document.getElementById('msg').textContent = data.message;
        loadProfile();
    }

    async function deleteEmployment(id) {
        await fetch(BASE + '/alumnus/employment/' + id, {method: 'DELETE', credentials: 'same-origin'});
        loadProfile();
    }

    loadProfile();
</script>
</body>
</html>
