<!DOCTYPE html>
<html>
<head>
    <title>API Keys</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen">
<div id="navbar"></div>
<script src="navbar.js"></script>

<div class="max-w-3xl mx-auto p-6 space-y-6">
    <h2 class="text-2xl font-bold text-gray-800">API Keys</h2>

    <!-- Generate new key -->
    <div class="bg-white rounded shadow p-4 space-y-3">
        <h3 class="font-semibold text-gray-700">Generate New Key</h3>
        <div class="flex gap-3">
            <input type="text" id="label" placeholder="Key label"
                   class="flex-1 border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
            <select id="permissions"
                    class="border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                <option value="read:alumni_of_day">AR App (read:alumni_of_day)</option>
                <option value="read:alumni,read:analytics">Analytics Dashboard (read:alumni, read:analytics)</option>
            </select>
            <button onclick="generateKey()"
                    class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700 transition text-sm">Generate
            </button>
        </div>
        <div id="new-key" class="text-sm text-gray-700 bg-gray-50 rounded p-3 hidden"></div>
    </div>

    <!-- Keys list -->
    <div class="bg-white rounded shadow p-4">
        <h3 class="font-semibold text-gray-700 mb-3">My Keys</h3>
        <div id="keys" class="space-y-2 text-sm"></div>
    </div>

    <p id="msg" class="text-sm text-gray-600"></p>
</div>

<script>
    const BASE = '/index.php/api/v1';

    async function loadKeys() {
        const res = await fetch(BASE + '/developer/keys', {credentials: 'same-origin'});
        if (res.status === 401) {
            window.location.href = 'login.html';
            return;
        }
        const data = await res.json();
        document.getElementById('keys').innerHTML = data.keys.map(k => `
            <div class="flex items-center justify-between border border-gray-200 rounded px-3 py-2">
                <div>
                    <span class="font-medium text-gray-800">${k.label}</span>
                    <span class="ml-2 text-xs px-2 py-0.5 rounded-full ${k.is_active == 1 ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-500'}">${k.is_active == 1 ? 'Active' : 'Revoked'}</span>
                    <span class="ml-2 text-xs text-gray-400">${k.permissions || ''}</span>
                    <div class="text-xs text-gray-400 mt-0.5">Created: ${k.created_at}</div>
                </div>
                <div class="flex gap-2">
                    <button onclick="viewStats(${k.id})" class="text-blue-600 hover:underline text-xs">Stats</button>
                    ${k.is_active == 1 ? '<button onclick="revokeKey(' + k.id + ')" class="text-red-400 hover:text-red-600 text-xs">Revoke</button>' : ''}
                </div>
            </div>`).join('');
    }

    async function generateKey() {
        const res = await fetch(BASE + '/developer/keys', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            credentials: 'same-origin',
            body: JSON.stringify({
                label: document.getElementById('label').value,
                permissions: document.getElementById('permissions').value
            })
        });
        const data = await res.json();
        if (data.status) {
            const newKey = document.getElementById('new-key');
            newKey.classList.remove('hidden');
            newKey.innerHTML = '<strong>Your key (save this - it will not be shown again):</strong><br><code class="break-all">' + data.key + '</code>';
        }
        document.getElementById('msg').textContent = data.message;
        loadKeys();
    }

    async function viewStats(id) {
        const res = await fetch(BASE + '/developer/keys/' + id + '/stats', {credentials: 'same-origin'});
        const data = await res.json();
        alert('Requests: ' + data.logs.length + '\nLast access: ' + (data.logs[0] ? data.logs[0].accessed_at : 'Never'));
    }

    async function revokeKey(id) {
        if (!confirm('Revoke this key?')) return;
        const res = await fetch(BASE + '/developer/keys/' + id, {method: 'DELETE', credentials: 'same-origin'});
        const data = await res.json();
        document.getElementById('msg').textContent = data.message;
        loadKeys();
    }

    loadKeys();
</script>
</body>
</html>
