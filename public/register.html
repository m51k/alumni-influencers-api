<!DOCTYPE html>
<html>
<head>
    <title>Register</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center">
<div class="bg-white p-8 rounded shadow w-full max-w-md">
    <h2 class="text-2xl font-bold mb-6 text-gray-800">Register</h2>
    <form id="form" class="space-y-4">
        <input type="email" id="email" placeholder="Email" required
               class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
        <input type="password" id="password" placeholder="Password" required
               class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
        <select id="role"
                class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
            <option value="alumnus">Alumnus</option>
            <option value="developer">Developer</option>
            <option value="staff">University Staff</option>
        </select>
        <button type="submit"
                class="w-full bg-blue-600 text-white py-2 rounded hover:bg-blue-700 transition">Register
        </button>
    </form>
    <p id="msg" class="mt-4 text-sm"></p>
    <div class="mt-4 text-sm text-gray-600">
        <a href="login.html" class="text-blue-600 hover:underline">Already have an account? Login</a>
    </div>
</div>
<script>
    document.getElementById('form').addEventListener('submit', async function (e) {
        e.preventDefault();
        const res = await fetch('/index.php/api/v1/auth/register', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
                email: document.getElementById('email').value,
                password: document.getElementById('password').value,
                role: document.getElementById('role').value
            })
        });
        const data = await res.json();
        const msg = document.getElementById('msg');
        msg.textContent = data.message;
        msg.className = 'mt-4 text-sm ' + (data.status ? 'text-green-600' : 'text-red-500');
    });
</script>
</body>
</html>
