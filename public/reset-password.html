<!DOCTYPE html>
<html>
<head>
    <title>Reset Password</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center">
<div class="bg-white p-8 rounded shadow w-full max-w-md">
    <h2 class="text-2xl font-bold mb-6 text-gray-800">Reset Password</h2>
    <form id="form" class="space-y-4">
        <input type="password" id="password" placeholder="New password" required
               class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
        <button type="submit"
                class="w-full bg-blue-600 text-white py-2 rounded hover:bg-blue-700 transition">Reset Password
        </button>
    </form>
    <p id="msg" class="mt-4 text-sm"></p>
</div>
<script>
    const token = new URLSearchParams(window.location.search).get('token');
    document.getElementById('form').addEventListener('submit', async function (e) {
        e.preventDefault();
        const res = await fetch('/index.php/api/v1/auth/reset-password', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({token, password: document.getElementById('password').value})
        });
        const data = await res.json();
        const msg = document.getElementById('msg');
        msg.textContent = data.message;
        msg.className = 'mt-4 text-sm ' + (data.status ? 'text-green-600' : 'text-red-500');
        if (data.status) setTimeout(() => window.location.href = 'login.html', 2000);
    });
</script>
</body>
</html>
